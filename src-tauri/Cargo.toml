[package]
name = "juice"
version = "0.1.0"
description = "Tray meter for local Claude Code token usage and estimated cost. Unofficial."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: the exe serves the built ui-dist/ itself, so a plain `cargo build` makes a working app.
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
