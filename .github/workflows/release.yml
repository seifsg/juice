# A pushed `v*` tag builds juice.exe on Windows, runs the full suite, and attaches the exe to a GitHub Release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Attach juice.exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" src-tauri/target/release/juice.exe --title "Juice $env:GITHUB_REF_NAME" --generate-notes
